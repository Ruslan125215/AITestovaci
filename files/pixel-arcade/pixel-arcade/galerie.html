    <h1>Galerie</h1>
    <p class="perex uzky">Tři obrázky, které jsou celé poskládané z čtverečků. Vlastní tvorba, žádné cizí postavy.</p>
    <div class="galerie">
      <figure>
        <img src="img/vetrelec.svg" alt="Tyrkysový pixel art mimozemšťan" width="220" height="160">
        <figcaption>Mimozemšťan. Klasický tvar útočníka z arkád, jen 11 × 8 čtverečků.</figcaption>
      </figure>
      <figure>
        <img src="img/joystick.svg" alt="Pixel art joystick s červenou kuličkou a modrým podstavcem" width="220" height="240">
        <figcaption>Joystick. Páčka s červenou kuličkou a tlačítko ve žluté.</figcaption>
      </figure>
      <figure>
        <img src="img/srdce.svg" alt="Červené pixel art srdce" width="180" height="160">
        <figcaption>Srdce. Symbol životů, který znáš z mnoha her.</figcaption>
      </figure>
    </div>
  </main>
